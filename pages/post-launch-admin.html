<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運用開始・定着管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/post-launch-admin.css"></head><body data-required-roles="safety-environment-admin"><main class="post-launch-page"><p><a href="system-settings.html">← 設定へ戻る</a></p><header class="page-heading"><div><span class="eyebrow">Launch & Adoption</span><h1>運用開始・定着管理</h1><p>初期利用者登録から運用開始後90日までの確認、課題、教育、利用状況を一括管理します。</p></div><div class="heading-actions"><button id="reloadDashboard" type="button">再読込</button><button id="exportReport" type="button">運用レポート出力</button></div></header><section id="launchBanner" class="launch-banner"></section><section id="summaryCards" class="summary-grid"></section><section class="panel"><div class="panel-heading"><h2>段階別チェック</h2></div><div class="panel-body"><div class="phase-tabs"><button data-phase="pre" class="is-active">開始前</button><button data-phase="day1">開始日</button><button data-phase="day7">7日後</button><button data-phase="day30">30日後</button><button data-phase="day90">90日後</button></div><div id="phaseChecklist" class="checklist"></div></div></section><section class="two-column"><section class="panel"><div class="panel-heading"><h2>初期利用者登録・権限確認</h2></div><div class="panel-body"><div class="form-grid"><label>想定利用者数<input id="plannedUsers" type="number" min="1" max="500" value="50"></label><label>登録済み人数<input id="registeredUsers" type="number" min="0" max="500" value="0"></label><label>ログイン確認済み<input id="verifiedLogins" type="number" min="0" max="500" value="0"></label><label>権限確認済み<input id="verifiedRoles" type="number" min="0" max="500" value="0"></label></div><label>確認メモ<textarea id="userNote" rows="4"></textarea></label><button id="saveUserStatus" class="primary-action" type="button">利用者状況を保存</button></div></section><section class="panel"><div class="panel-heading"><h2>教育・周知記録</h2></div><div class="panel-body"><div class="form-grid"><label>実施日<input id="trainingDate" type="date"></label><label>対象<select id="trainingAudience"><option>全利用者</option><option>事業所管理者</option><option>安全環境室</option><option>管理者</option></select></label></div><label>内容<textarea id="trainingContent" rows="4" placeholder="操作説明、法令更新、情報管理など"></textarea></label><button id="addTraining" class="primary-action" type="button">教育記録を追加</button><div id="trainingList" class="record-list"></div></div></section></section><section class="panel"><div class="panel-heading"><h2>課題・問い合わせ管理</h2></div><div class="panel-body"><div class="issue-form"><label>区分<select id="issueType"><option value="login">ログイン</option><option value="permission">権限</option><option value="data">法令・データ</option><option value="application">申請番号・写真</option><option value="performance">性能</option><option value="other">その他</option></select></label><label>優先度<select id="issuePriority"><option value="normal">通常</option><option value="high">高</option><option value="critical">緊急</option></select></label><label class="wide">件名<input id="issueTitle"></label><label class="wide">内容<textarea id="issueDetail" rows="3"></textarea></label></div><button id="addIssue" class="primary-action" type="button">課題を登録</button><div id="issueList" class="record-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>運用開始後レビュー</h2></div><div class="panel-body"><div class="form-grid"><label>レビュー時点<select id="reviewPeriod"><option value="day7">7日後</option><option value="day30">30日後</option><option value="day90">90日後</option></select></label><label>総合判定<select id="reviewDecision"><option value="stable">安定</option><option value="watch">要観察</option><option value="corrective">是正必要</option></select></label></div><label>所見・次回対応<textarea id="reviewNote" rows="5"></textarea></label><button id="saveReview" class="primary-action" type="button">レビューを保存</button><div id="reviewHistory" class="record-list"></div></div></section><p id="pageMessage" class="fixed-setting" aria-live="polite"></p></main><script src="../assets/js/storage.js"></script><script src="../assets/js/role-access.js?v=213"></script><script src="../assets/js/post-launch-admin.js?v=213"></script><script src="../assets/js/session-guard.js"></script></body></html>
