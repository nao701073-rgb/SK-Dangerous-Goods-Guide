<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>原文ページ表示</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#0d3154;background:#eef4f8}
    *{box-sizing:border-box}body{margin:0}.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0d3d66;color:#fff;box-shadow:0 2px 8px #0002}.bar button,.bar a{border:1px solid #fff8;background:#fff;color:#0d3d66;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:700}.bar h1{font-size:16px;margin:0;flex:1}.wrap{max-width:1100px;margin:18px auto;padding:0 12px 32px}.notice{background:#fff;border:1px solid #c9d8e5;border-radius:10px;padding:12px 14px;margin-bottom:12px;line-height:1.6}.page{display:block;width:100%;height:auto;background:#fff;border:1px solid #b8cad9;border-radius:8px;box-shadow:0 5px 18px #183b5b22}.error{padding:30px;background:#fff;border-radius:10px;color:#a11}
  </style>
</head>
<body>
  <header class="bar"><button type="button" id="back">← 戻る</button><h1 id="title">原文ページ表示</h1><a id="pdf" target="_blank" rel="noopener">PDFを開く</a></header>
  <main class="wrap"><div class="notice">指定された原文ページを正確に表示しています。スマートフォンでは画像を拡大して確認できます。</div><img id="pageImage" class="page" alt="原文PDFページ"></main>
<script>
(()=>{const q=new URLSearchParams(location.search);const doc=q.get('doc')||'notification';const page=Math.max(1,parseInt(q.get('page')||'1',10)||1);const section=q.get('section')||'';const map={notification:{pdf:'../references/originals/dangerous-goods-notification.pdf',img:'../assets/pdf-page-images/dangerous-goods-notification/page-'+page+'.png',label:'危告示'},regulation:{pdf:'../references/originals/dangerous-goods-regulations.pdf',img:'../assets/domestic-law-pages/regulation/page-'+page+'.png',label:'危規則'},radioactive:{pdf:'../references/originals/radioactive-materials-notification.pdf',img:'../assets/domestic-law-pages/radioactive/page-'+page+'.png',label:'放告示'},imdg:{pdf:'../references/originals/imdg-code-amendment-42-24-msc556-108.pdf',img:'../assets/pdf-page-images/imdg-code/page-'+page+'.jpg',label:section?'IMDG Code '+section:'IMDG Code'}};const x=map[doc]||map.notification;document.title=x.label+' PDF '+page+'ページ';document.getElementById('title').textContent=x.label+'（PDF '+page+'ページ）';const a=document.getElementById('pdf');a.href=x.pdf+'#page='+page+'&zoom=page-width';const img=document.getElementById('pageImage');img.src=x.img;img.alt=x.label+' PDF '+page+'ページ';img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('p'),{className:'error',textContent:'ページ画像を表示できません。右上の「PDFを開く」から原文を確認してください。'}));};document.getElementById('back').onclick=()=>history.length>1?history.back():window.close();})();
</script>
</body></html>
