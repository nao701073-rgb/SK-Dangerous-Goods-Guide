<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン｜検査・検品業務サポートシステム</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/login-production.css?v=330"><link rel="stylesheet" href="../assets/css/typography-quality.css?v=187">
</head><body class="login-production">
<div class="login-scene" aria-hidden="true"><div class="terminal-silhouette"></div><div class="terminal-lights"></div></div>
<main class="login-wrap"><div class="login-shell"><img class="login-brand-logo" src="../assets/images/sk-brand-logo-v82.png" alt="SK"><h1 class="login-title">検査・検品業務サポートシステム</h1><p class="login-description">危険物情報、申請番号管理、関連法令、関連資料を一つの画面から確認できる、オフライン対応の業務支援システムです。</p>
<section class="login-card"><h1>ログイン</h1><p class="login-note">管理者から付与されたログインIDとパスワードを入力してください。必要な場合は、続けて確認コードを入力します。</p><div class="account-note">利用者ごとに発行された個別アカウントでログインしてください。</div>
<form id="loginForm"><section id="credentialPanel"><label>ログインID<input id="loginId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ログインIDを入力してください" required autofocus></label><label>パスワード<span class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" minlength="8" placeholder="パスワードを入力してください" aria-describedby="capsLockNotice" required><button id="togglePassword" class="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false">表示</button></span></label><p id="capsLockNotice" class="caps-lock-notice" hidden>Caps Lockがオンになっています。</p><label style="display:flex;grid-template-columns:auto 1fr;align-items:center;font-weight:400"><input id="rememberLogin" type="checkbox">この端末でログイン状態を保持</label><button id="loginSubmit" type="submit">ログイン</button><button id="forgotPassword" class="secondary" type="button">パスワードを忘れた場合</button></section><section id="mfaPanel" class="mfa-panel" hidden><p class="login-note">登録メールアドレスへ送信された6桁の確認コードを入力してください。</p><p id="mfaDestination" class="mfa-destination" hidden></p><label>確認コード<input id="mfaCode" class="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" enterkeyhint="done" aria-describedby="mfaDestination mfaExpiry mfaResendStatus" placeholder="000000"></label><p id="mfaExpiry" class="mfa-status" aria-live="polite"></p><button id="verifyMfa" type="button" disabled>確認してログイン</button><button id="resendMfa" class="secondary" type="button">確認コードを再送</button><p id="mfaResendStatus" class="mfa-status" aria-live="polite"></p><button id="backToCredentials" class="secondary" type="button">ログイン情報を入力し直す</button></section><div id="loginMessage" class="login-message" role="status" aria-live="polite" aria-atomic="true"></div></form></section>
<p class="login-help"><a href="cloud-connection.html">クラウド接続設定</a></p><p class="login-footer">© 2026 Shin Nihon Kentei Kyokai All rights reserved.</p></div></main>
<div id="loginSuccess" class="login-success" aria-hidden="true"><div class="login-success__flash"></div><div class="login-success__logo"><img src="../assets/images/sk-brand-logo-v82.png" alt=""></div></div>
<script src="../data/organization-master.js"></script><script src="../assets/js/organization.js"></script><script src="../assets/js/storage.js?v=178"></script><script src="../assets/js/api-client.js?v=178"></script>
<script>
(()=>{const $=id=>document.getElementById(id);const message=t=>$('loginMessage').textContent=t;let challengeId=null;let remember=false;let transitionStarted=false;let mfaExpiresAt=null;let mfaTimer=null;let resendTimer=null;let mfaVerifying=false;let resendInProgress=false;let challengeVersion=0;
const params=new URLSearchParams(location.search);
const AUTH_TIMEOUT_MS=20000;const withAuthTimeout=(promise,label='認証通信')=>{let timeoutId;const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>{const error=new Error(`${label}がタイムアウトしました。通信状態を確認して、もう一度お試しください。`);error.name='AuthTimeoutError';reject(error);},AUTH_TIMEOUT_MS);});return Promise.race([promise,timeout]).finally(()=>clearTimeout(timeoutId));};
const safeNext=()=>{const value=params.get('next');if(!value)return '../index.html';try{const url=new URL(value,location.href);if(url.origin!==location.origin)return '../index.html';if(!url.pathname.startsWith(new URL('../',location.href).pathname))return '../index.html';return `${url.pathname}${url.search}${url.hash}`;}catch{return '../index.html';}};
const destinationFor=data=>data?.passwordChangeRequired?'change-password.html':safeNext();
const existingDestination=()=>ISSApi.isPasswordChangeRequired()?'change-password.html':safeNext();
if(ISSApi.isAuthenticated()){location.replace(existingDestination());return;}
if(params.get('passwordChanged')==='1')message('パスワードを変更しました。新しいパスワードでログインしてください。');
else if(params.get('logoutAll')==='1')message('すべての端末からログアウトしました。再度ログインしてください。');
else if(params.get('timeout')==='1'||localStorage.getItem('iss-session-logout-reason')==='idle'){message('一定時間操作がなかったため、自動的にログアウトしました。');localStorage.removeItem('iss-session-logout-reason');}
const resolveLoginTime=()=>{const hour=new Date().getHours();return hour>=6&&hour<10?'morning':hour>=10&&hour<16?'day':hour>=16&&hour<19?'evening':'night';};
const applyLoginTime=()=>{document.body.dataset.loginTime=resolveLoginTime();};applyLoginTime();setInterval(applyLoginTime,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyLoginTime();});
const submitButton=$('loginSubmit');const setBusy=(busy,label='ログイン')=>{submitButton.disabled=busy;submitButton.textContent=busy?'確認中…':label;$('loginForm').setAttribute('aria-busy',String(busy));};
const passwordInput=$('loginPassword');$('togglePassword').addEventListener('click',()=>{const visible=passwordInput.type==='text';passwordInput.type=visible?'password':'text';$('togglePassword').textContent=visible?'表示':'非表示';$('togglePassword').setAttribute('aria-label',visible?'パスワードを表示':'パスワードを非表示');$('togglePassword').setAttribute('aria-pressed',String(!visible));passwordInput.focus();});
const updateCapsLock=e=>{$('capsLockNotice').hidden=!(e.getModifierState&&e.getModifierState('CapsLock'));};passwordInput.addEventListener('keydown',updateCapsLock);passwordInput.addEventListener('keyup',updateCapsLock);passwordInput.addEventListener('blur',()=>{$('capsLockNotice').hidden=true;});
const normalizeDigits=value=>String(value||'').replace(/[０-９]/g,c=>String(c.charCodeAt(0)-0xFEE0)).replace(/\D/g,'').slice(0,6);
const clearMfaTimers=()=>{if(mfaTimer)clearInterval(mfaTimer);if(resendTimer)clearInterval(resendTimer);mfaTimer=resendTimer=null;};window.addEventListener('pagehide',clearMfaTimers);
const updateMfaExpiry=()=>{if(!mfaExpiresAt){$('mfaExpiry').textContent='';return;}const seconds=Math.max(0,Math.ceil((mfaExpiresAt-Date.now())/1000));if(seconds<=0){$('mfaExpiry').textContent='確認コードの有効期限が切れました。再送してください。';$('verifyMfa').disabled=true;if(mfaTimer){clearInterval(mfaTimer);mfaTimer=null;}return;}$('mfaExpiry').textContent=`有効期限まで ${Math.floor(seconds/60)}分${String(seconds%60).padStart(2,'0')}秒`;};
const startMfaExpiry=expiresAt=>{mfaExpiresAt=expiresAt?new Date(expiresAt).getTime():null;if(mfaTimer)clearInterval(mfaTimer);updateMfaExpiry();mfaTimer=setInterval(updateMfaExpiry,1000);};
const startResendCooldown=seconds=>{let remaining=Math.max(0,Number(seconds)||0);const button=$('resendMfa');if(resendTimer)clearInterval(resendTimer);const update=()=>{button.disabled=remaining>0;$('mfaResendStatus').textContent=remaining>0?`再送できるまで ${remaining}秒`:'確認コードを再送できます。';if(remaining<=0&&resendTimer){clearInterval(resendTimer);resendTimer=null;}remaining-=1;};update();if(remaining>=0)resendTimer=setInterval(update,1000);};
const applyMfaChallenge=data=>{challengeVersion+=1;challengeId=data.challengeId;startMfaExpiry(data.expiresAt);startResendCooldown(data.resendAfterSeconds);const destination=$('mfaDestination');if(data.maskedEmail){destination.textContent=`送信先：${data.maskedEmail}`;destination.hidden=false;}else{destination.textContent='';destination.hidden=true;}$('mfaCode').value='';$('verifyMfa').disabled=true;};
const showMfa=data=>{$('credentialPanel').hidden=true;$('mfaPanel').hidden=false;applyMfaChallenge(data);$('mfaCode').focus();};const showCredentials=()=>{challengeVersion+=1;challengeId=null;mfaExpiresAt=null;clearMfaTimers();$('mfaPanel').hidden=true;$('credentialPanel').hidden=false;$('mfaCode').value='';$('mfaDestination').hidden=true;$('mfaExpiry').textContent='';$('mfaResendStatus').textContent='';};
const completeLogin=data=>{if(transitionStarted)return;transitionStarted=true;clearMfaTimers();ISSApi.storeSession(data,remember);message('ログインしました。');const layer=$('loginSuccess');layer.classList.add('is-active');layer.setAttribute('aria-hidden','false');const destination=destinationFor(data);const move=()=>location.replace(destination);const timer=setTimeout(move,1100);layer.addEventListener('click',()=>{clearTimeout(timer);move();},{once:true});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){clearTimeout(timer);move();}},{once:true});};
const verifyMfa=async()=>{if(mfaVerifying||transitionStarted)return;if(!challengeId)return message('ログイン情報を入力し直してください。');if(navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');const activeChallenge=challengeId;const activeVersion=challengeVersion;const code=normalizeDigits($('mfaCode').value);$('mfaCode').value=code;if(code.length!==6)return message('6桁の確認コードを入力してください。');mfaVerifying=true;$('verifyMfa').disabled=true;$('verifyMfa').textContent='照合中…';$('mfaCode').disabled=true;$('backToCredentials').disabled=true;$('resendMfa').disabled=true;message('確認コードを照合中…');try{const result=await withAuthTimeout(ISSApi.verifyMfa(activeChallenge,code),'確認コードの照合');if(activeVersion===challengeVersion&&activeChallenge===challengeId)completeLogin(result);}catch(err){if(activeVersion===challengeVersion){message(err.message);$('mfaCode').disabled=false;$('mfaCode').focus();$('mfaCode').select();}}finally{mfaVerifying=false;if(!transitionStarted&&activeVersion===challengeVersion){$('verifyMfa').textContent='確認してログイン';$('mfaCode').disabled=false;$('backToCredentials').disabled=false;$('resendMfa').disabled=false;updateMfaExpiry();$('verifyMfa').disabled=normalizeDigits($('mfaCode').value).length!==6||Boolean(mfaExpiresAt&&mfaExpiresAt<=Date.now());}}};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!$('mfaPanel').hidden){await verifyMfa();return;}if(submitButton.disabled||transitionStarted)return;if(navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');message('ログイン情報を確認中…');setBusy(true);try{remember=$('rememberLogin').checked;const loginId=$('loginId').value.trim();$('loginId').value=loginId;const data=await withAuthTimeout(ISSApi.startLogin(loginId,$('loginPassword').value),'ログイン');if(data.mfaRequired){showMfa(data);message('確認コードを入力してください。');return;}completeLogin(data);}catch(err){message(err.message);passwordInput.focus();passwordInput.select();}finally{if(!transitionStarted)setBusy(false);}});
$('mfaCode').addEventListener('input',e=>{const code=normalizeDigits(e.target.value);e.target.value=code;$('verifyMfa').disabled=code.length!==6||Boolean(mfaExpiresAt&&mfaExpiresAt<=Date.now());if(code.length===6&&!mfaVerifying)verifyMfa();});
$('mfaCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verifyMfa();}});$('verifyMfa').addEventListener('click',verifyMfa);
$('resendMfa').addEventListener('click',async()=>{if(!challengeId||$('resendMfa').disabled||resendInProgress)return;if(navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');const activeChallenge=challengeId;const activeVersion=challengeVersion;resendInProgress=true;message('確認コードを再送しています…');$('resendMfa').disabled=true;$('resendMfa').textContent='再送中…';try{const data=await withAuthTimeout(ISSApi.resendMfa(activeChallenge),'確認コードの再送');if(activeVersion===challengeVersion&&activeChallenge===challengeId){applyMfaChallenge(data);message('確認コードを再送しました。新しいコードを入力してください。');$('mfaCode').focus();}}catch(err){if(activeVersion===challengeVersion){message(err.message);startResendCooldown(5);}}finally{resendInProgress=false;$('resendMfa').textContent='確認コードを再送';}});$('backToCredentials').addEventListener('click',()=>{showCredentials();message('');$('loginId').focus();});
window.addEventListener('offline',()=>message('ネットワーク接続が切れました。入力内容は保持されています。'));window.addEventListener('online',()=>message('ネットワーク接続が回復しました。'));
$('forgotPassword').addEventListener('click',async()=>{const button=$('forgotPassword');if(button.disabled)return;const loginId=$('loginId').value.trim();if(!loginId)return message('ログインIDを入力してから押してください。');if(navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');message('再設定手続きを受け付けています…');button.disabled=true;button.textContent='送信中…';try{await withAuthTimeout(ISSApi.requestPasswordReset(loginId),'パスワード再設定の受付');message('登録メールアドレスがある場合、再設定用の案内を送信しました。');}catch(err){message(err.message);}finally{button.disabled=false;button.textContent='パスワードを忘れた場合';}});
})();;
</script><script src="../assets/js/online-status.js?v=178"></script></body></html>
