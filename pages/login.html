<!DOCTYPE html>
<html lang="ja"><head>
  <meta name="sk-build" content="part503">

<script src="../assets/js/structured-data-overrides.js?v=381"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン｜検査・検品業務サポートシステム</title>
<link rel="preload" href="../assets/images/login-business-background-4k.png" as="image"><link rel="preload" href="../assets/images/sk-brand-logo-square-v348.png" as="image"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/login-production.css?v=368"><link rel="stylesheet" href="../assets/css/typography-quality.css?v=187">
</head><body class="login-production">
<div class="login-scene" aria-hidden="true"><div class="terminal-silhouette"></div><div class="terminal-lights"></div></div>
<main class="login-wrap" id="mainContent"><div class="login-shell"><div class="login-brand" aria-hidden="true"><img class="login-brand-logo" src="../assets/images/sk-brand-logo-square-v348.png" srcset="../assets/images/sk-brand-logo-square-v348.png 1x, ../assets/images/sk-brand-logo-square-2x-v357.png 2x" width="700" height="700" alt="SK" decoding="async" fetchpriority="high"></div><h1 class="login-title">検査・検品業務サポートシステム</h1><p class="login-description"><span>危険物情報、申請番号管理、申請書確認、固縛力参考算出、</span><br class="login-description-break"><span>関連法令、関連資料を確認するための業務支援システムです。</span></p>
<section class="login-card" aria-labelledby="loginCardTitle"><h2 id="loginCardTitle">ログイン</h2><p id="credentialGuidance" class="login-note">ログインIDとパスワードを入力してください。</p>
<form id="loginForm" aria-describedby="credentialGuidance"><section id="credentialPanel" aria-labelledby="loginCardTitle"><label class="login-field login-field--user"><span>ログインID</span><input id="loginId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ログインIDを入力してください" enterkeyhint="next" required autofocus></label><label class="login-field login-field--password"><span>パスワード</span><span class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" minlength="8" placeholder="パスワードを入力してください" aria-describedby="capsLockNotice" enterkeyhint="go" required><button id="togglePassword" class="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false">表示</button></span></label><p id="capsLockNotice" class="caps-lock-notice" hidden>Caps Lockがオンになっています。</p><label class="remember-login"><input id="rememberLogin" type="checkbox"><span>この端末でログイン状態を保持</span></label><button id="loginSubmit" type="submit">ログイン</button><button id="forgotPassword" class="secondary" type="button">パスワードを忘れた場合</button></section><section id="mfaPanel" class="mfa-panel" aria-labelledby="mfaTitle" hidden><h2 id="mfaTitle">確認コード</h2><p class="login-note">登録メールアドレスへ送信された6桁の確認コードを入力してください。</p><p id="mfaDestination" class="mfa-destination" hidden></p><label>確認コード<input id="mfaCode" class="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" enterkeyhint="done" aria-describedby="mfaDestination mfaExpiry mfaResendStatus" placeholder="000000"></label><p id="mfaExpiry" class="mfa-status" aria-live="polite"></p><button id="verifyMfa" type="button" disabled>確認してログイン</button><button id="resendMfa" class="secondary" type="button">確認コードを再送</button><p id="mfaResendStatus" class="mfa-status" aria-live="polite"></p><button id="backToCredentials" class="secondary" type="button">ログイン情報を入力し直す</button></section><div id="loginMessage" class="login-message" role="status" aria-live="polite" aria-atomic="true" data-state="idle"></div></form></section>
<noscript><p class="login-noscript">この画面を利用するにはJavaScriptを有効にしてください。</p></noscript>
<p class="login-footer">© 2026 Shin Nihon Kentei Kyokai All rights reserved.</p></div></main>
<div id="loginSuccess" class="login-success" aria-hidden="true"><div class="login-success__flash"></div><div class="login-success__logo"><img src="../assets/images/sk-brand-logo-square-v348.png" srcset="../assets/images/sk-brand-logo-square-v348.png 1x, ../assets/images/sk-brand-logo-square-2x-v357.png 2x" width="700" height="700" alt="" decoding="async"></div></div>
<script src="../data/organization-master.js"></script><script src="../assets/js/organization.js"></script><script src="../assets/js/storage.js?v=178"></script><script src="../assets/js/api-client.js?v=503"></script>
<script>
(()=>{const $=id=>document.getElementById(id);const message=(text,state)=>{const node=$('loginMessage');node.textContent=text;const resolved=state||(text.includes('ログインしました')||text.includes('回復しました')||text.includes('送信しました')||text.includes('変更しました')?'success':text.includes('確認中')||text.includes('照合中')||text.includes('再送しています')||text.includes('受け付けています')?'progress':text?'error':'idle');node.dataset.state=resolved;};let challengeId=null;let remember=false;let transitionStarted=false;let mfaExpiresAt=null;let mfaTimer=null;let resendTimer=null;let mfaVerifying=false;let resendInProgress=false;let challengeVersion=0;
const params=new URLSearchParams(location.search);
const AUTH_TIMEOUT_MS=20000;const withAuthTimeout=(promise,label='認証通信')=>{let timeoutId;const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>{const error=new Error(`${label}がタイムアウトしました。通信状態を確認して、もう一度お試しください。`);error.name='AuthTimeoutError';reject(error);},AUTH_TIMEOUT_MS);});return Promise.race([promise,timeout]).finally(()=>clearTimeout(timeoutId));};
const safeNext=()=>{const value=params.get('next')||params.get('returnTo');if(!value)return '../index.html';try{const url=new URL(value,location.href);if(url.origin!==location.origin)return '../index.html';if(!url.pathname.startsWith(new URL('../',location.href).pathname))return '../index.html';return `${url.pathname}${url.search}${url.hash}`;}catch{return '../index.html';}};
const destinationFor=data=>data?.passwordChangeRequired?'change-password.html':safeNext();
const existingDestination=()=>ISSApi.isPasswordChangeRequired()?'change-password.html':safeNext();
if(ISSApi.isAuthenticated()){location.replace(existingDestination());return;}
if(params.get('passwordChanged')==='1')message('パスワードを変更しました。新しいパスワードでログインしてください。');
else if(params.get('logoutAll')==='1')message('すべての端末からログアウトしました。再度ログインしてください。');
else if(params.get('timeout')==='1'||localStorage.getItem('iss-session-logout-reason')==='idle'){message('一定時間操作がなかったため、自動的にログアウトしました。');localStorage.removeItem('iss-session-logout-reason');}

const submitButton=$('loginSubmit');const credentialControls=[...$('credentialPanel').querySelectorAll('input,button')];const setBusy=(busy,label='ログイン')=>{credentialControls.forEach(control=>{if(control!==submitButton)control.disabled=busy;});submitButton.disabled=busy;submitButton.textContent=busy?'確認中…':label;submitButton.classList.toggle('is-busy',busy);$('loginForm').setAttribute('aria-busy',String(busy));};
const passwordInput=$('loginPassword');$('togglePassword').addEventListener('click',()=>{const visible=passwordInput.type==='text';passwordInput.type=visible?'password':'text';$('togglePassword').textContent=visible?'表示':'非表示';$('togglePassword').setAttribute('aria-label',visible?'パスワードを表示':'パスワードを非表示');$('togglePassword').setAttribute('aria-pressed',String(!visible));passwordInput.focus();});
const updateCapsLock=e=>{$('capsLockNotice').hidden=!(e.getModifierState&&e.getModifierState('CapsLock'));};passwordInput.addEventListener('keydown',updateCapsLock);passwordInput.addEventListener('keyup',updateCapsLock);passwordInput.addEventListener('blur',()=>{$('capsLockNotice').hidden=true;});
const normalizeDigits=value=>String(value||'').replace(/[０-９]/g,c=>String(c.charCodeAt(0)-0xFEE0)).replace(/\D/g,'').slice(0,6);
const clearMfaTimers=()=>{if(mfaTimer)clearInterval(mfaTimer);if(resendTimer)clearInterval(resendTimer);mfaTimer=resendTimer=null;};window.addEventListener('pagehide',clearMfaTimers);
const updateMfaExpiry=()=>{if(!mfaExpiresAt){$('mfaExpiry').textContent='';return;}const seconds=Math.max(0,Math.ceil((mfaExpiresAt-Date.now())/1000));if(seconds<=0){$('mfaExpiry').textContent='確認コードの有効期限が切れました。再送してください。';$('verifyMfa').disabled=true;if(mfaTimer){clearInterval(mfaTimer);mfaTimer=null;}return;}$('mfaExpiry').textContent=`有効期限まで ${Math.floor(seconds/60)}分${String(seconds%60).padStart(2,'0')}秒`;};
const startMfaExpiry=expiresAt=>{mfaExpiresAt=expiresAt?new Date(expiresAt).getTime():null;if(mfaTimer)clearInterval(mfaTimer);updateMfaExpiry();mfaTimer=setInterval(updateMfaExpiry,1000);};
const startResendCooldown=seconds=>{let remaining=Math.max(0,Number(seconds)||0);const button=$('resendMfa');if(resendTimer)clearInterval(resendTimer);const update=()=>{button.disabled=remaining>0;$('mfaResendStatus').textContent=remaining>0?`再送できるまで ${remaining}秒`:'確認コードを再送できます。';if(remaining<=0&&resendTimer){clearInterval(resendTimer);resendTimer=null;}remaining-=1;};update();if(remaining>=0)resendTimer=setInterval(update,1000);};
const applyMfaChallenge=data=>{challengeVersion+=1;challengeId=data.challengeId;startMfaExpiry(data.expiresAt);startResendCooldown(data.resendAfterSeconds);const destination=$('mfaDestination');if(data.maskedEmail){destination.textContent=`送信先：${data.maskedEmail}`;destination.hidden=false;}else{destination.textContent='';destination.hidden=true;}$('mfaCode').value='';$('verifyMfa').disabled=true;};
const showMfa=data=>{$('credentialPanel').hidden=true;$('mfaPanel').hidden=false;applyMfaChallenge(data);$('mfaCode').focus();};const showCredentials=()=>{challengeVersion+=1;challengeId=null;mfaExpiresAt=null;clearMfaTimers();$('mfaPanel').hidden=true;$('credentialPanel').hidden=false;$('mfaCode').value='';$('mfaDestination').hidden=true;$('mfaExpiry').textContent='';$('mfaResendStatus').textContent='';};
const completeLogin=data=>{if(transitionStarted)return;transitionStarted=true;clearMfaTimers();ISSApi.storeSession(data,remember);message('ログインしました。');const layer=$('loginSuccess');layer.classList.add('is-active');layer.setAttribute('aria-hidden','false');const destination=destinationFor(data);const move=()=>window.ISSAuthBridge?.navigate?window.ISSAuthBridge.navigate(destination):location.replace(destination);const timer=setTimeout(move,1100);layer.addEventListener('click',()=>{clearTimeout(timer);move();},{once:true});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){clearTimeout(timer);move();}},{once:true});};
const verifyMfa=async()=>{if(mfaVerifying||transitionStarted)return;if(!challengeId)return message('ログイン情報を入力し直してください。');if(window.ISSApi?.usesRemoteAuth?.()&&navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');const activeChallenge=challengeId;const activeVersion=challengeVersion;const code=normalizeDigits($('mfaCode').value);$('mfaCode').value=code;if(code.length!==6)return message('6桁の確認コードを入力してください。');mfaVerifying=true;$('verifyMfa').disabled=true;$('verifyMfa').textContent='照合中…';$('mfaCode').disabled=true;$('backToCredentials').disabled=true;$('resendMfa').disabled=true;message('確認コードを照合中…');try{const result=await withAuthTimeout(ISSApi.verifyMfa(activeChallenge,code),'確認コードの照合');if(activeVersion===challengeVersion&&activeChallenge===challengeId)completeLogin(result);}catch(err){if(activeVersion===challengeVersion){message(err.message);$('mfaCode').disabled=false;$('mfaCode').focus();$('mfaCode').select();}}finally{mfaVerifying=false;if(!transitionStarted&&activeVersion===challengeVersion){$('verifyMfa').textContent='確認してログイン';$('mfaCode').disabled=false;$('backToCredentials').disabled=false;$('resendMfa').disabled=false;updateMfaExpiry();$('verifyMfa').disabled=normalizeDigits($('mfaCode').value).length!==6||Boolean(mfaExpiresAt&&mfaExpiresAt<=Date.now());}}};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!$('mfaPanel').hidden){await verifyMfa();return;}if(submitButton.disabled||transitionStarted)return;if(window.ISSApi?.usesRemoteAuth?.()&&navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');message('ログイン情報を確認中…');setBusy(true);try{remember=$('rememberLogin').checked;const loginId=$('loginId').value.trim();$('loginId').value=loginId;const data=await withAuthTimeout(ISSApi.startLogin(loginId,$('loginPassword').value),'ログイン');if(data.mfaRequired){setBusy(false);showMfa(data);message('確認コードを入力してください。','info');return;}completeLogin(data);}catch(err){message(err.message);passwordInput.focus();passwordInput.select();}finally{if(!transitionStarted)setBusy(false);}});
$('mfaCode').addEventListener('input',e=>{const code=normalizeDigits(e.target.value);e.target.value=code;$('verifyMfa').disabled=code.length!==6||Boolean(mfaExpiresAt&&mfaExpiresAt<=Date.now());if(code.length===6&&!mfaVerifying)verifyMfa();});
$('mfaCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verifyMfa();}});$('verifyMfa').addEventListener('click',verifyMfa);
$('resendMfa').addEventListener('click',async()=>{if(!challengeId||$('resendMfa').disabled||resendInProgress)return;if(window.ISSApi?.usesRemoteAuth?.()&&navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');const activeChallenge=challengeId;const activeVersion=challengeVersion;resendInProgress=true;message('確認コードを再送しています…');$('resendMfa').disabled=true;$('resendMfa').textContent='再送中…';try{const data=await withAuthTimeout(ISSApi.resendMfa(activeChallenge),'確認コードの再送');if(activeVersion===challengeVersion&&activeChallenge===challengeId){applyMfaChallenge(data);message('確認コードを再送しました。新しいコードを入力してください。');$('mfaCode').focus();}}catch(err){if(activeVersion===challengeVersion){message(err.message);startResendCooldown(5);}}finally{resendInProgress=false;$('resendMfa').textContent='確認コードを再送';}});$('backToCredentials').addEventListener('click',()=>{showCredentials();message('');$('loginId').focus();});
window.addEventListener('offline',()=>{if(window.ISSApi?.usesRemoteAuth?.())message('ネットワーク接続が切れました。入力内容は保持されています。');});window.addEventListener('online',()=>{if(window.ISSApi?.usesRemoteAuth?.())message('ネットワーク接続が回復しました。');});
$('forgotPassword').addEventListener('click',async()=>{const button=$('forgotPassword');if(button.disabled)return;const loginId=$('loginId').value.trim();if(!loginId)return message('ログインIDを入力してから押してください。');if(window.ISSApi?.usesRemoteAuth?.()&&navigator.onLine===false)return message('ネットワークに接続されていません。接続後にもう一度お試しください。');message('再設定手続きを受け付けています…');button.disabled=true;button.textContent='送信中…';try{await withAuthTimeout(ISSApi.requestPasswordReset(loginId),'パスワード再設定の受付');message(window.ISSApi?.usesRemoteAuth?.()?'登録メールアドレスがある場合、パスワード再設定の案内を送信しました。':'パスワードを忘れた場合は、システム管理者に再設定を依頼してください。');}catch(err){message(err.message);}finally{button.disabled=false;button.textContent='パスワードを忘れた場合';}});
})();;
</script><script src="../assets/js/online-status.js?v=178"></script><script src="../assets/js/version-guard.js?v=503"></script>
</body></html>
