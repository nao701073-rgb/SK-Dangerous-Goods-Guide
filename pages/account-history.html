<body data-page="account-history"><header class="app-header"><a class="icon-button" href="settings.html" aria-label="ユーザー設定へ戻る" title="ユーザー設定へ戻る">←</a><div><h1>ログイン履歴・端末管理</h1></div></header>
<main class="workspace account-history-page"><div class="page-breadcrumb">ホーム ＞ ユーザー設定 ＞ ログイン履歴・端末管理</div><div class="page-heading-row"><div><h1>ログイン履歴・端末管理</h1><p>自分の最近の認証履歴を確認し、必要な場合は全端末のログイン状態を終了できます。</p></div><button id="refreshHistory" class="secondary-action" type="button">履歴を更新</button></div>
<section class="security-summary" aria-label="アカウント状況"><article><span>最終ログイン</span><strong id="lastLoginAt">確認中</strong></article><article><span>パスワード変更</span><strong id="passwordChangedAt">確認中</strong></article><article><span>多要素認証</span><strong id="mfaStatus">確認中</strong></article><article><span>表示件数</span><strong id="eventCount">0件</strong></article></section>
<section class="panel"><div class="panel-heading"><h2>最近の認証履歴</h2></div><div class="panel-body"><p class="history-note">IPアドレスや端末情報に心当たりがない場合は、直ちに全端末ログアウトを行い、パスワードを変更してください。</p><div class="table-scroll"><table class="history-table"><thead><tr><th>日時</th><th>内容</th><th>接続元</th><th>端末・ブラウザ</th></tr></thead><tbody id="historyRows"><tr><td colspan="4">読み込み中です。</td></tr></tbody></table></div></div></section>
<section class="panel danger-panel"><div class="panel-heading"><h2>全端末ログアウト</h2></div><div class="panel-body"><p>現在の端末を含む、すべてのログイン状態を無効化します。実行後は再ログインが必要です。</p><button id="logoutAll" class="danger-action" type="button">すべての端末からログアウト</button></div></section>
<div id="historyMessage" class="settings-message" aria-live="polite"></div></main>
