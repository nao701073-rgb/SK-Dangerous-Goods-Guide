<script src="../assets/js/structured-data-overrides.js?v=381"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>権限・承認・削除申請管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/system-layout.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/access-governance-admin.css"></head><body data-page="access-governance-admin" data-required-roles="safety-environment-admin"><main class="admin-tool-page"><p><a href="system-settings.html">← システム設定へ戻る</a></p><section class="readiness-hero"><div><span>Part 220</span><h1>権限・承認・削除申請管理</h1><p>役割別操作、削除申請、権限変更、承認履歴、定期棚卸しを一括管理します。</p></div><button id="refreshGovernance" type="button">最新状態を取得</button></section><section id="governanceSummary" class="admin-card-grid"></section><section class="panel"><div class="panel-heading"><h2>削除申請</h2></div><div class="panel-body"><form id="deletionRequestForm" class="governance-grid"><label>対象種別<select id="deletionTargetType"><option value="application">申請番号</option><option value="photo">写真</option></select></label><label>対象ID<input id="deletionTargetId" required maxlength="120"></label><label>所属事業所<input id="deletionOffice" maxlength="120"></label><label class="wide">削除理由<textarea id="deletionReason" required maxlength="3000"></textarea></label><div class="wide"><button type="submit">削除申請を登録</button></div></form><p class="admin-status" id="deletionStatus">未登録</p><div id="deletionRequestList" class="action-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>権限変更申請</h2></div><div class="panel-body"><form id="roleChangeForm" class="governance-grid"><label>利用者ID<input id="roleUserId" required></label><label>変更後権限<select id="roleRequested"><option value="guest">ゲスト</option><option value="office-user">事業所利用者</option><option value="office-admin">事業所管理者</option><option value="safety-environment-staff">安全環境室職員</option><option value="safety-environment-director">安全環境室長</option><option value="safety-environment-admin">システム管理者</option></select></label><label>適用予定日<input id="roleEffectiveDate" type="date"></label><label class="wide">変更理由<textarea id="roleReason" required maxlength="3000"></textarea></label><div class="wide"><button type="submit">権限変更申請を登録</button></div></form><div id="roleChangeList" class="action-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>定期権限棚卸し</h2></div><div class="panel-body"><form id="accessReviewForm" class="governance-grid"><label>対象日<input id="reviewDate" type="date" required></label><label>対象人数<input id="reviewTargetCount" type="number" min="0" max="500" required></label><label>要是正人数<input id="reviewIssueCount" type="number" min="0" max="500" required></label><label>次回点検日<input id="reviewNextDate" type="date"></label><label class="wide">点検所見<textarea id="reviewNotes" maxlength="3000"></textarea></label><div class="wide"><button type="submit">棚卸し結果を保存</button></div></form><div id="accessReviewList" class="action-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>監査レポート</h2></div><div class="panel-body report-tools"><button id="downloadGovernanceReport" type="button">JSONを保存</button><pre id="governanceReportPreview">未作成</pre></div></section></main><script src="../assets/js/storage.js"></script><script src="../assets/js/api-client.js?v=423"></script><script src="../assets/js/role-access.js?v=388"></script><script src="../assets/js/session-guard.js?v=422"></script><script src="../assets/js/access-governance-admin.js"></script><script src="../assets/js/usage-tracking.js?v=222"></script>
