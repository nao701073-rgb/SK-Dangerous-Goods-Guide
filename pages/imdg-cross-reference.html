  <main class="workspace cross-reference-page">
    <div class="page-heading-row">
      <div>
        <h1>国内法令・IMDG Code</h1>
        <p>国内法令とIMDG Codeにまたがる参照先を、コード単位で確認します。</p>
      </div>
      <a class="back-link" href="dangerous-goods-search.html">← 危険物検索</a>

    <section class="panel">
      <div class="panel-heading"><h2>コード検索</h2></div>
      <div class="panel-body">
        <form id="crossReferenceForm" class="compact-search">
          <input id="crossReferenceInput" placeholder="例：P002、IBC08、T1、TP33、SP274、SW23">
          <button type="submit">参照</button>
        </form>
      </div>
    </section>

    <section id="crossReferenceResult" class="cross-reference-result"></section>

    <section class="panel">
      <div class="panel-heading"><h2>参照区分</h2></div>
      <div id="crossReferenceCategories" class="category-grid panel-body"></div>

    <aside class="data-notice">
      <strong>表示方針</strong>
      <p>
        国内法令（危規則・危告示）とIMDG Codeの参照先を併記します。
        英語原文が未登録のコードは、推測せず「参照位置特定済み」と表示します。
      </p>
    </aside>
