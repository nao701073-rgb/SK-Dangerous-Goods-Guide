<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>認証・試験運用管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/identity-operations-admin.css"><link rel="stylesheet" href="../assets/css/typography-quality.css?v=187"></head>
<body data-page="identity-operations-admin" data-required-roles="safety-environment-admin"><main class="identity-admin"><p><a href="system-settings.html">← 設定へ戻る</a></p><h1>認証・試験運用管理</h1><p class="lead">約50名での試験運用から将来150名程度までを想定し、初期利用者、認証、MFA、強制ログアウト、監査、通知、バックアップ、運用開始判定を一つの画面で管理します。</p>
<section id="identitySummary" class="summary-grid"></section>
<section class="panel"><div class="panel-heading"><h2>要対応アカウント</h2><button id="reloadIdentity" type="button">再読込</button></div><div class="panel-body"><div class="table-wrap"><table><thead><tr><th>利用者</th><th>権限・所属</th><th>状態</th><th>最終ログイン</th><th>管理操作</th></tr></thead><tbody id="identityUsers"></tbody></table></div><p id="identityStatus" aria-live="polite"></p></div></section>
<section class="panel"><div class="panel-heading"><h2>運用開始チェック</h2><button id="saveReadiness" type="button">確認結果を保存</button></div><div class="panel-body"><p>本番運用の開始前に、認証・権限・監査・バックアップ等の確認結果と証跡を記録します。</p><div id="readinessChecks" class="readiness-list"></div><p id="readinessStatus" aria-live="polite"></p></div></section>
<section class="panel"><div class="panel-heading"><h2>アカウント棚卸し記録</h2></div><div class="panel-body"><div class="form-grid"><label>点検対象期間<input id="reviewPeriod" type="month"></label><label>点検所見<textarea id="reviewFindings" rows="3"></textarea></label><label>是正対応<textarea id="reviewAction" rows="3"></textarea></label></div><button id="saveReview" type="button">棚卸し記録を保存</button><p id="reviewStatus" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>期間</th><th>利用者状況</th><th>所見・是正</th><th>実施日</th></tr></thead><tbody id="reviewHistory"></tbody></table></div></div></section>
</main><script src="../assets/js/storage.js"></script><script src="../assets/js/api-client.js?v=205"></script><script src="../assets/js/role-access.js?v=219"></script><script src="../assets/js/identity-operations-admin.js?v=205"></script><script src="../assets/js/session-guard.js"></script><script src="../assets/js/usage-tracking.js?v=222"></script>
</body></html>
