<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード再設定</title><link rel="stylesheet" href="../assets/css/style.css"><style>.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;padding:28px;border:1px solid #dbe5ef;border-radius:16px}.card label{display:grid;gap:7px;margin:14px 0}.card input,.card button{min-height:46px;border-radius:8px}.card input{border:1px solid #ccd9e6;padding:0 12px}.card button{width:100%;border:0;background:#0b5cab;color:#fff;font-weight:800}</style></head><body><main class="wrap"><section class="card"><h1>パスワード再設定</h1><form id="f"><label>新しいパスワード<input id="p1" type="password" required></label><label>確認入力<input id="p2" type="password" required></label><button>再設定</button><p id="m"></p></form></section></main><script src="../assets/js/storage.js?v=178"></script><script src="../assets/js/api-client.js?v=178"></script><script>f.onsubmit=async e=>{e.preventDefault();if(p1.value!==p2.value)return m.textContent='確認入力が一致しません。';try{await ISSApi.resetPassword(new URLSearchParams(location.search).get('token'),p1.value);m.textContent='再設定しました。';setTimeout(()=>location.href='login.html',1000)}catch(err){m.textContent=err.message}}</script>  <script src="../assets/js/session-guard.js"></script>
</body></html>
