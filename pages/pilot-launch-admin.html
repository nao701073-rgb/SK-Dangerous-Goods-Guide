<!DOCTYPE html><html lang="ja"><head><script src="../assets/js/auth-bootstrap.js?v=388"></script>
<script src="../assets/js/structured-data-overrides.js?v=381"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クラウド試験運用実行・受入管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/pilot-launch-admin.css"></head><body data-required-roles="safety-environment-admin"><main class="pilot-page"><p><a href="system-settings.html">← 設定へ戻る</a></p><header class="page-heading"><div><span class="eyebrow">Cloud Pilot Execution</span><h1>クラウド試験運用実行・受入管理</h1><p>初期50名の招待、初回ログイン、MFA、権限確認、性能、バックアップ、受入判定を一括管理します。</p></div><button id="reloadData" type="button">再読込</button></header><section id="pilotBanner" class="pilot-banner"></section><section id="summaryCards" class="summary-grid summary-grid--wide"></section><section class="panel"><div class="panel-heading"><h2>試験運用開始・受入条件</h2></div><div id="readinessChecks" class="panel-body check-grid"></div></section><section class="two-column"><section class="panel"><div class="panel-heading"><h2>試験運用バッチ</h2></div><div class="panel-body"><label>名称<input id="batchName" value="初期50名クラウド試験運用"></label><div class="form-grid"><label>対象人数<input id="targetUserCount" type="number" min="1" max="150" value="50"></label><label>開始予定日<input id="startDate" type="date"></label></div><label>備考<textarea id="batchNotes" rows="3"></textarea></label><button id="createBatch" class="primary-action" type="button">バッチを登録</button><div id="batchList" class="record-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>試験結果の記録</h2></div><div class="panel-body"><label>対象バッチ<select id="testBatch"><option value="">指定なし</option></select></label><div class="form-grid"><label>試験区分<select id="testType"><option value="permission-matrix">権限マトリクス</option><option value="login">ログイン</option><option value="mail">招待・再設定メール</option><option value="load-50">50名性能</option><option value="load-150">150名性能</option><option value="photo-storage">写真保存</option><option value="backup-restore">バックアップ・復元</option></select></label><label>結果<select id="testStatus"><option value="passed">合格</option><option value="warning">要確認</option><option value="failed">不合格</option></select></label></div><label>証跡・結果<textarea id="testEvidence" rows="4"></textarea></label><button id="saveTest" class="primary-action" type="button">試験結果を保存</button></div></section></section><section class="two-column"><section class="panel"><div class="panel-heading"><h2>招待実行結果</h2></div><div class="panel-body"><label>対象バッチ<select id="inviteBatch"><option value="">指定なし</option></select></label><div class="form-grid form-grid--3"><label>対象人数<input id="inviteTarget" type="number" min="0" value="50"></label><label>送信<input id="inviteSent" type="number" min="0" value="0"></label><label>到達<input id="inviteDelivered" type="number" min="0" value="0"></label><label>失敗<input id="inviteFailed" type="number" min="0" value="0"></label><label>期限切れ<input id="inviteExpired" type="number" min="0" value="0"></label><label>対象役割<select id="inviteRole"><option value="all">全役割</option><option value="office-user">事業所利用者</option><option value="office-admin">事業所管理者</option><option value="safety-environment-director">安全環境室長</option><option value="safety-environment-staff">安全環境室職員</option></select></label></div><label>証跡・備考<textarea id="inviteEvidence" rows="3"></textarea></label><button id="saveInvitationRun" class="primary-action" type="button">招待結果を保存</button><div id="invitationList" class="record-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>利用者進捗スナップショット</h2></div><div class="panel-body"><label>対象バッチ<select id="progressBatch"><option value="">指定なし</option></select></label><div class="form-grid form-grid--3"><label>対象人数<input id="progressTotal" type="number" min="0" value="50"></label><label>招待済み<input id="progressInvited" type="number" min="0" value="0"></label><label>初回ログイン<input id="progressLogin" type="number" min="0" value="0"></label><label>PW変更<input id="progressPassword" type="number" min="0" value="0"></label><label>MFA完了<input id="progressMfa" type="number" min="0" value="0"></label><label>権限確認<input id="progressPermission" type="number" min="0" value="0"></label><label>ロック中<input id="progressLocked" type="number" min="0" value="0"></label><label>支援必要<input id="progressSupport" type="number" min="0" value="0"></label></div><label>所見<textarea id="progressNotes" rows="3"></textarea></label><button id="saveProgress" class="primary-action" type="button">進捗を保存</button><div id="progressList" class="record-list"></div></div></section></section><section class="two-column"><section class="panel"><div class="panel-heading"><h2>受入判定</h2></div><div class="panel-body"><label>対象バッチ<select id="decisionBatch"><option value="">指定なし</option></select></label><label>判定<select id="decision"><option value="hold">保留</option><option value="continue-pilot">試験継続</option><option value="expand-150">150名拡張可</option><option value="ready-for-production">正式運用準備可</option></select></label><div id="acceptanceChecklist" class="acceptance-checklist"></div><label>未解決課題数<input id="openIssueCount" type="number" min="0" value="0"></label><label>判定理由<textarea id="decisionReason" rows="4"></textarea></label><label>次回確認日<input id="nextReviewDate" type="date"></label><button id="saveDecision" class="primary-action" type="button">受入判定を保存</button><div id="decisionList" class="record-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>直近の試験結果</h2><button id="exportReport" type="button">統合JSON出力</button></div><div id="testList" class="panel-body record-list"></div></section></section><p id="pageMessage" class="fixed-setting" aria-live="polite"></p></main><script src="../assets/js/storage.js"></script><script src="../assets/js/role-access.js?v=388"></script><script src="../assets/js/pilot-launch-admin.js?v=215"></script><script src="../assets/js/session-guard.js?v=422"></script><script src="../assets/js/usage-tracking.js?v=222"></script>
</body></html>
