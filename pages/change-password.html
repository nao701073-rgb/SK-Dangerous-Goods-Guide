<!DOCTYPE html>
<html lang="ja"><head><script src="../assets/js/auth-bootstrap.js?v=363"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>初回パスワード変更｜検査・検品業務サポートシステム</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/login-production.css?v=364"><link rel="stylesheet" href="../assets/css/change-password.css?v=310">
</head><body class="login-production password-change-page">
<div class="login-scene" aria-hidden="true"><div class="terminal-silhouette"></div><div class="terminal-lights"></div></div>
<main class="login-wrap"><div class="login-shell"><img class="login-brand-logo" src="../assets/images/sk-brand-logo-v82.png" alt="SK"><h1 class="login-title">検査・検品業務サポートシステム</h1>
<section class="login-card password-change-card"><p id="changeModeLabel" class="step-label">パスワード変更</p><h2 id="changeModeTitle">パスワードを変更してください</h2><p id="changeModeDescription" class="login-note">現在のパスワードを確認し、新しいパスワードへ変更します。</p>
<div class="password-policy" aria-label="パスワード要件"><strong>新しいパスワードの要件</strong><ul><li>12文字以上</li><li>英大文字・英小文字・数字・記号を各1文字以上</li><li>ログインIDや氏名から推測しにくい内容</li></ul></div>
<form id="changePasswordForm"><label>現在のパスワード<input id="currentPassword" type="password" autocomplete="current-password" required></label><label>新しいパスワード<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><label>新しいパスワード（確認）<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><label class="show-password"><input id="showPasswords" type="checkbox">入力したパスワードを表示</label><button id="submitPasswordChange" type="submit">パスワードを変更する</button><button id="cancelButton" class="secondary" type="button">変更せずに戻る</button><button id="logoutButton" class="secondary" type="button">ログアウト</button><div id="changeMessage" class="login-message" aria-live="polite"></div></form></section>
<p class="login-footer">© 2026 新日本検定協会 All Rights Reserved.</p></div></main>
<script src="../assets/js/storage.js?v=178"></script><script src="../assets/js/api-client.js?v=310"></script>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id);if(!ISSApi.isAuthenticated())return location.href='login.html';const forced=ISSApi.isPasswordChangeRequired();const msg=t=>$('changeMessage').textContent=t;if(forced){$('changeModeLabel').textContent='初回ログイン手続き';$('changeModeTitle').textContent='パスワードを変更してください';$('changeModeDescription').textContent='管理者から付与された初期パスワードは、そのまま使用できません。本人だけが分かる新しいパスワードへ変更してください。';$('submitPasswordChange').textContent='変更して再ログインへ進む';$('cancelButton').hidden=true;}else{$('changeModeLabel').textContent='アカウントセキュリティ';$('changeModeTitle').textContent='パスワード変更';$('changeModeDescription').textContent='安全のため、変更後はこの端末を含むすべてのログイン状態を終了し、再ログインします。';}
$('showPasswords').addEventListener('change',e=>['currentPassword','newPassword','confirmPassword'].forEach(id=>$(id).type=e.target.checked?'text':'password'));$('changePasswordForm').addEventListener('submit',async e=>{e.preventDefault();const current=$('currentPassword').value,next=$('newPassword').value,confirm=$('confirmPassword').value;if(next!==confirm)return msg('新しいパスワードと確認入力が一致しません。');if(current===next)return msg('現在のパスワードとは異なるパスワードを設定してください。');msg('パスワードを変更しています…');try{await ISSApi.changePassword(current,next);ISSApi.finishPasswordChange();msg('パスワードを変更しました。安全のため再ログインしてください。');setTimeout(()=>location.href='login.html?passwordChanged=1',900)}catch(err){msg(err.message)}});$('cancelButton').addEventListener('click',()=>location.href='settings.html');$('logoutButton').addEventListener('click',()=>{ISSApi.clearSession();location.href='login.html'});})();
</script></body></html>
