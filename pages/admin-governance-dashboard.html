nput id="taskDueDate" type="date" required></label><label>繰返し<select id="taskRecurrence"><option value="none">なし</option><option value="monthly">毎月</option><option value="quarterly">四半期</option><option value="semiannual">半年</option><option value="annual">毎年</option></select></label><div class="wide"><button type="submit">タスクを登録</button></div></form><div id="taskList" class="action-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>是正対応</h2></div><div class="panel-body"><form id="correctiveActionForm" class="governance-form"><label>発生元<select id="actionSourceType"><option value="access-review">権限点検</option><option value="recovery-drill">緊急復旧点検</option><option value="audit">監査</option><option value="incident">障害・事故</option><option value="other">その他</option></select></label><label>件名<input id="actionTitle" maxlength="200" required></label><label>優先度<select id="actionPriority"><option value="medium">中</option><option value="low">低</option><option value="high">高</option><option value="critical">緊急</option></select></label><label>期限<input id="actionDueDate" type="date"></label><label class="wide">内容<textarea id="actionDescription" maxlength="3000"></textarea></label><div class="wide"><button type="submit">是正対応を登録</button></div></form><p id="actionStatus" class="admin-status">未登録</p><div id="actionList" class="action-list"></div></div></section><section class="panel"><div class="panel-heading"><h2>月次管理レポート</h2></div><div class="panel-body report-tools"><label>対象月<input id="reportPeriod" type="month"></label><button id="generateReport" type="button">レポート作成</button><button id="downloadReport" type="button">JSONを保存</button><button id="saveReportSnapshot" type="button">監査記録へ保存</button><pre id="reportPreview">未作成</pre></div></section></main><script src="../assets/js/storage.js"></script><script src="../assets/js/api-client.js?v=508"></script><script src="../assets/js/role-access.js?v=503"></script><script src="../assets/js/session-guard.js?v=508">
