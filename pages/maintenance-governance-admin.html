<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>継続保守・年度更新管理｜検査・検品業務サポートシステム</title>
<link href="../assets/css/style.css" rel="stylesheet"/>
<link href="../assets/css/system-layout.css" rel="stylesheet"/>
<link href="../assets/css/settings.css" rel="stylesheet"/>
<link href="../assets/css/admin-tools.css" rel="stylesheet"/>
</head>
<body data-page="maintenance-governance-admin" data-required-roles="safety-environment-admin">
<header class="app-header"><a class="icon-button" href="../index.html" aria-label="ホームへ戻る">⌂</a><div><h1>継続保守・年度更新管理</h1></div></header>
<main class="workspace admin-tool-page">
<div class="page-breadcrumb">ホーム ＞ システム設定 ＞ 継続保守・年度更新管理</div>
<section class="readiness-hero"><div><span>Part 251</span><h2>引継ぎ後の保守・法令更新・年度更新を一括管理</h2><p>管理責任、定期保守、法令更新履歴、問い合わせ・障害の引継ぎ、年度切替、次期版計画を継続的に記録します。</p></div><div class="readiness-actions"><button id="saveMaintenanceGovernance" type="button">保存</button><button id="exportMaintenanceGovernance" type="button">JSON出力</button></div></section>
<section class="panel"><div class="panel-heading"><h2>管理責任と対象</h2></div><div class="panel-body settings-list">
<label class="settings-row settings-row--select"><div><strong>対象環境</strong><p>試験環境、本番環境等を記録します。</p></div><input id="environment" type="text" placeholder="例：クラウド本番環境"/></label>
<label class="settings-row settings-row--select"><div><strong>対象バージョン</strong><p>現在運用中の版を記録します。</p></div><input id="targetVersion" type="text" value="Part 251"/></label>
<label class="settings-row settings-row--select"><div><strong>運用責任者</strong><p>日常運用と保守判断の責任者を記録します。</p></div><input id="operationsOwner" type="text"/></label>
<label class="settings-row settings-row--select"><div><strong>法令・データ更新責任者</strong><p>原典確認、差分検証、承認準備の担当者を記録します。</p></div><input id="regulationOwner" type="text"/></label>
<label class="settings-row settings-row--select"><div><strong>バックアップ・復元責任者</strong><p>保全と復旧確認の担当者を記録します。</p></div><input id="backupOwner" type="text"/></label>
</div></section>
<section class="panel"><div class="panel-heading"><h2>定期保守計画</h2></div><div class="panel-body"><div id="maintenanceChecklist" class="check-list"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>法令・データ更新実施記録</h2></div><div class="panel-body settings-list">
<label class="settings-row settings-row--select"><div><strong>対象法令・規則</strong><p>危規則、危告示、IMDG Code等を入力します。</p></div><input id="regulationName" type="text"/></label>
<label class="settings-row settings-row--select"><div><strong>旧版 → 新版</strong><p>版番号と施行日を含めて記録します。</p></div><input id="regulationVersionChange" type="text" placeholder="例：42-24 → 43-26"/></label>
<label class="settings-row settings-row--select"><div><strong>更新実施日</strong><p>更新候補の作成・承認・公開を行った日を記録します。</p></div><input id="regulationUpdatedAt" type="date"/></label>
<label class="settings-row settings-row--select"><div><strong>検証・承認結果</strong><p>差分件数、品質検査、承認者、公開結果を記録します。</p></div><textarea id="regulationResult" rows="5"></textarea></label>
</div></section>
<section class="panel"><div class="panel-heading"><h2>問い合わせ・障害・残課題の引継ぎ</h2></div><div class="panel-body settings-list">
<label class="settings-row settings-row--select"><div><strong>未解決問い合わせ件数</strong><p>次の担当者へ引き継ぐ未解決件数です。</p></div><input id="openInquiryCount" type="number" min="0" value="0"/></label>
<label class="settings-row settings-row--select"><div><strong>未解決障害件数</strong><p>継続対応が必要な障害・不具合件数です。</p></div><input id="openIncidentCount" type="number" min="0" value="0"/></label>
<label class="settings-row settings-row--select"><div><strong>重大障害件数</strong><p>業務停止または誤判断につながる重大障害件数です。</p></div><input id="criticalIncidentCount" type="number" min="0" value="0"/></label>
<label class="settings-row settings-row--select"><div><strong>引継ぎ内容</strong><p>対象、担当者、期限、暫定対応、恒久対応を記録します。</p></div><textarea id="handoffNotes" rows="6"></textarea></label>
</div></section>
<section class="panel"><div class="panel-heading"><h2>年度更新・次期版計画</h2></div><div class="panel-body settings-list">
<label class="settings-row settings-row--select"><div><strong>対象年度</strong><p>年度総括と次年度計画の対象年度です。</p></div><input id="fiscalYear" type="number" min="2026" max="2100"/></label>
<label class="settings-row settings-row--select"><div><strong>年度総括</strong><p>運用状況、法令更新、障害、改善、教育を総括します。</p></div><textarea id="annualSummary" rows="5"></textarea></label>
<label class="settings-row settings-row--select"><div><strong>次期バージョン</strong><p>次に予定する版番号または名称を記録します。</p></div><input id="nextVersion" type="text" placeholder="例：Version 1.1"/></label>
<label class="settings-row settings-row--select"><div><strong>次期版の主要内容</strong><p>機能追加、法令更新、性能改善、文書更新等を記録します。</p></div><textarea id="nextVersionPlan" rows="5"></textarea></label>
<label class="settings-row settings-row--select"><div><strong>次回総合点検日</strong><p>定期保守・年度更新の次回確認日を設定します。</p></div><input id="nextReviewDate" type="date"/></label>
</div></section>
<section class="panel"><div class="panel-heading"><h2>継続運用判定</h2></div><div class="panel-body settings-list">
<label class="settings-row settings-row--select"><div><strong>判定</strong><p>未完了項目や重大障害がある場合は「継続確認」とします。</p></div><select id="decision"><option value="pending">継続確認</option><option value="maintainable">継続運用可</option><option value="annual-closed">年度更新完了</option><option value="next-release-ready">次期版準備完了</option></select></label>
<label class="settings-row settings-row--select"><div><strong>総括・承認メモ</strong><p>判定根拠、残課題、承認状況を記録します。</p></div><textarea id="decisionNotes" rows="5"></textarea></label>
<div class="fixed-setting" id="maintenanceGovernanceStatus">未保存</div>
</div></section>
</main>
<script src="../assets/js/session-guard.js"></script>
<script src="../assets/js/maintenance-governance-admin.js"></script>
</body></html>
