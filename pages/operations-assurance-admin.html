<script src="../assets/js/structured-data-overrides.js?v=381"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運用保証・継続管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/operations-assurance-admin.css"><link rel="stylesheet" href="../assets/css/design-system-review.css?v=508">

</head><body data-required-roles="safety-environment-admin"><main class="operations-assurance-admin"><p><a href="system-settings.html">← 設定へ戻る</a></p><h1>運用保証・継続管理</h1><p class="lead">利用者ライフサイクル、権限棚卸し、障害、復元訓練、運用指標を一画面で管理します。</p><section id="assuranceSummary" class="summary-grid"></section>
<section class="panel"><div class="panel-heading"><h2>利用者ライフサイクル</h2><button id="reloadAssurance">再読込</button></div><div class="panel-body"><div class="form-grid"><label>利用者<select id="lifeUser"></select></label><label>処理<select id="lifeAction"><option value="transfer">異動</option><option value="role-change">権限変更</option><option value="suspend">利用停止</option><option value="reactivate">再開</option><option value="retire">退職</option></select></label><label>適用日<input id="lifeDate" type="date"></label><label>新権限<select id="lifeRole"><option value="">変更なし</option><option value="office-user">利用者</option><option value="office-admin">事業所管理者</option><option value="safety-environment-director">安全環境室長</option><option value="safety-environment-staff">安全環境室職員</option><option value="safety-environment-admin">システム管理者</option></select></label><label>理由<textarea id="lifeReason"></textarea></label></div><button id="saveLifecycle">予定を登録</button><div id="lifecycleList" class="record-list"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>障害・インシデント管理</h2></div><div class="panel-body"><div class="form-grid"><label>重要度<select id="incidentSeverity"><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="critical">重大</option></select></label><label>区分<input id="incidentCategory" value="system"></label><label>件名<input id="incidentTitle"></label><label>発生日時<input id="incidentOccurred" type="datetime-local"></label><label>影響範囲<input id="incidentScope"></label><label>内容<textarea id="incidentDescription"></textarea></label></div><button id="saveIncident">障害を登録</button><div id="incidentList" class="record-list"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>バックアップ復元訓練</h2></div><div class="panel-body"><div class="form-grid"><label>実施日<input id="restoreDate" type="date"></label><label>対象<select id="restoreTarget"><option value="database">データベース</option><option value="photos">写真</option><option value="full-system">全体</option></select></label><label>結果<select id="restoreResult"><option value="passed">合格</option><option value="partial">一部合格</option><option value="failed">不合格</option></select></label><label>復旧時間（分）<input id="restoreTime" type="number" min="0"></label><label>証跡<textarea id="restoreEvidence"></textarea></label><label>問題・是正<textarea id="restoreIssues"></textarea></label></div><button id="saveRestore">訓練記録を保存</button><div id="restoreList" class="record-list"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>運用指標・監査レポート</h2><button id="exportAssurance">JSON出力</button></div><div class="panel-body"><div id="metricList" class="record-list"></div><button id="captureMetrics">本日の指標を記録</button></div></section></main><script src="../assets/js/storage.js"></script><script src="../assets/js/api-client.js?v=508"></script><script src="../assets/js/role-access.js?v=503"></script><script src="../assets/js/operations-assurance-admin.js?v=207"></script><script src="../assets/js/session-guard.js?v=508"></script><script src="../assets/js/usage-tracking.js?v=222"></script>
<script src="../assets/js/version-guard.js?v=131"></script>
