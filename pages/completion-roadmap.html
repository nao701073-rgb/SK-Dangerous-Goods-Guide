<!DOCTYPE html>
<html lang="ja"><head><script src="../assets/js/auth-bootstrap.js?v=363"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>完成版統合チェック｜検査・検品業務サポートシステム</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/system-layout.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/settings.css">
</head><body data-required-roles="safety-environment-admin">
<header class="app-header"><a class="icon-button" href="system-settings.html" aria-label="システム設定へ戻る">←</a><div><h1>完成版統合チェック</h1></div></header>
<main class="workspace admin-tool-page"><div class="page-breadcrumb">ホーム ＞ システム設定 ＞ 完成版統合チェック</div>
<section class="readiness-hero"><div><span id="roadmapBadge">統合フェーズ</span><h2>完成版に向けた残作業を集約</h2><p>重複機能を整理し、総合試験と文書更新までを一つの進捗として管理します。</p></div><div class="readiness-actions"><button id="exportRoadmap" type="button">JSON出力</button><button id="resetRoadmap" type="button">入力を初期化</button></div></section>
<section class="panel"><div class="panel-heading"><div><h2>統合進捗</h2><p>各分野を確認し、証跡・残課題を記録してください。</p></div><span class="fixed-setting" id="roadmapProgress">0 / 8</span></div><div class="panel-body"><div id="roadmapChecks" class="check-list"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>総括</h2></div><div class="panel-body settings-list"><label class="settings-row settings-row--select"><div><strong>現在の判定</strong><p>すべて完了後に「試作完成」を選択できます。</p></div><select id="roadmapDecision"><option value="in-progress">統合作業中</option><option value="review">総合確認中</option><option value="complete">試作完成</option></select></label><label class="settings-row settings-row--select"><div><strong>残課題・確認事項</strong></div><textarea id="roadmapNotes" rows="5" placeholder="クラウド配置時に必要な設定など"></textarea></label><div class="settings-actions"><button class="primary-action" id="saveRoadmap" type="button">進捗を保存</button><a class="secondary-action" href="operations-acceptance-admin.html">運用受入・定期点検</a></div><div id="roadmapMessage" class="settings-message" aria-live="polite"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>完成の範囲</h2></div><div class="panel-body"><p>本画面での「試作完成」は、画面、権限、API仕様、データ構造、運用手順、総合検査が整った状態を示します。クラウド契約、専用URL、メール配信、実利用者登録は配置先決定後の作業です。</p></div></section>
</main><script src="../assets/js/role-access.js?v=239"></script><script src="../assets/js/session-guard.js"></script><script src="../assets/js/completion-roadmap.js?v=239"></script></body></html>
