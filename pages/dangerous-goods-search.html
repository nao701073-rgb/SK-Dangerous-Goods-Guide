      <main class="workspace">
        <div class="page-breadcrumb">ホーム ＞ 危険物検索</div>
        <div class="page-heading-row">
          <div>
            <h1>危険物検索</h1>
            <p>国連番号または正式品名から危険物情報を検索します。</p>
          </div>
        </div>

        <section class="panel search-panel">
          <div class="panel-heading"><h2>検索条件</h2></div>
          <div class="panel-body">
            <form id="searchForm" class="search-form-expanded">
              <div class="compact-search">
                <input id="searchInput" type="search" placeholder="例：UN1203、1203、GASOLINE、ガソリン">
                <button type="submit">検索</button>
              </div>
              <div class="advanced-search-actions">
                <button id="advancedSearchToggle" class="advanced-toggle" type="button" aria-expanded="false" aria-controls="advancedSearchPanel">詳細検索を開く</button>
                <button id="resetSearch" class="advanced-reset" type="button">条件をクリア</button>
              </div>
              <div class="search-preset-toolbar" aria-label="保存した検索条件">
                <label><span>保存した検索条件</span><select id="searchPresetSelect"><option value="">選択してください</option></select></label>
                <button id="loadSearchPreset" type="button">呼び出す</button>
                <button id="saveSearchPreset" type="button">現在の条件を保存</button>
                <button id="deleteSearchPreset" class="danger-lite" type="button">削除</button>
              </div>
              <div id="advancedSearchPanel" class="advanced-search-panel" hidden>
                <div class="advanced-search-grid">
                  <label><span>国連番号</span><input id="filterUnNumber" inputmode="numeric" placeholder="例：1992"></label>
                  <label><span>分類</span><select id="filterClassification"><option value="">すべて</option></select></label>
                  <label><span>等級</span><select id="filterClass"><option value="">すべて</option></select></label>
                  <label><span>副次危険性等級</span><select id="filterSubsidiary"><option value="">すべて</option></select></label>
                  <label><span>容器等級</span><select id="filterPackingGroup"><option value="">すべて</option><option value="I">I</option><option value="II">II</option><option value="III">III</option><option value="-">指定なし</option></select></label>
                  <label><span>海洋汚染物質</span><select id="filterMarine"><option value="">すべて</option><option value="yes">別表第1にP表記あり</option><option value="no">別表第1にP表記なし</option></select></label>
                  <label><span>少量危険物</span><select id="filterLimited"><option value="">すべて</option><option value="yes">規定あり</option><option value="no">規定なし</option></select></label>
                  <label><span>微量危険物</span><select id="filterExcepted"><option value="">すべて</option><option value="yes">規定あり</option><option value="no">規定なし</option></select></label>
                  <label><span>包装・容器コード</span><input id="filterPackingCode" placeholder="例：P001、IBC02、T7"></label>
                  <label><span>備考・特別規定</span><input id="filterSpecialProvision" placeholder="例：SP274"></label>
                  <label><span>EmSコード</span><input id="filterEms" placeholder="例：F-E、S-D"></label>
                  <label><span>積載方法・隔離コード</span><input id="filterTransportCode" placeholder="例：SW2、SG35"></label>
                </div>
                <div class="advanced-search-footer">
                  <label class="result-limit-label"><span>並び順</span><select id="resultSort"><option value="un-asc">国連番号 昇順</option><option value="un-desc">国連番号 降順</option><option value="name-ja">日本語品名順</option><option value="class">等級順</option></select></label>
                  <label class="result-limit-label"><span>表示件数</span><select id="resultLimit"><option value="40">40件</option><option value="100">100件</option><option value="200">200件</option><option value="all">すべて</option></select></label>
                  <button id="applyAdvancedSearch" type="submit">詳細条件で検索</button>
                </div>
              </div>
            </form>
            <div id="activeConditions" class="active-conditions" hidden></div>
          </div>
        </section>

        <div class="search-meta-row">
          <strong id="resultCount">検索結果</strong>
          <div>
            <button id="favoriteFilter" class="filter-button" type="button">☆ お気に入り</button>
            <button id="historyButton" class="filter-button" type="button">履歴</button>
            <button id="exportSearchCsv" class="filter-button" type="button">検索結果CSV</button>
          </div>
        </div>

        <section id="searchResults" class="result-grid"></section>

9 0 0 1 6.9 6h1.4v-.8A1.2 1.2 0 0 1 9.5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m8.3 10 1.3 1.3 2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 10.6h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m8.3 14 1.3 1.3 2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 14.6h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18.2" cy="18.2" r="3.2" fill="currentColor"/><text x="18.2" y="19.1" text-anchor="middle" font-size="3.3" font-family="Arial, sans-serif" font-weight="700" fill="#ffffff">No.</text></svg></span><span>申請</span></a></nav>
