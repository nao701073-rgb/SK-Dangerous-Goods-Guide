<script src="../assets/js/structured-data-overrides.js?v=381"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正式運用準備・認証管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css"><link rel="stylesheet" href="../assets/css/production-identity-admin.css"><link rel="stylesheet" href="../assets/css/typography-quality.css?v=187"><link rel="stylesheet" href="../assets/css/design-system-review.css?v=508">

<body data-page="production-identity-admin" data-required-roles="safety-environment-admin"><main class="production-identity-admin"><p><a href="system-settings.html">← 設定へ戻る</a></p><h1>正式運用準備・認証管理</h1><p class="lead">約50名の試験運用から150名程度の正式運用までを対象に、招待、認証状態、強制ログアウト、監査検索、バックアップ確認、運用開始判定をまとめて管理します。</p>
<section id="productionIdentitySummary" class="summary-grid"></section>
<section class="panel"><div class="panel-heading"><h2>利用者招待・初回登録</h2><button id="reloadProductionIdentity" type="button">再読込</button></div><div class="panel-body"><div class="form-grid"><label>利用者<select id="invitationUser"></select></label><label>有効日数<input id="invitationDays" type="number" min="1" max="30" value="7"></label><label>備考<input id="invitationNote" maxlength="500"></label></div><button id="sendInvitation" type="button">招待メールを発行</button><p id="invitationStatus" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>利用者</th><th>状態</th><th>期限</th><th>送信日</th><th>操作</th></tr></thead><tbody id="invitationHistory"></tbody></table></div></div></section>
<section class="panel"><div class="panel-heading"><h2>認証・ログイン活動</h2></div><div class="panel-body"><p class="note">JWTはサーバーにセッション本体を保存しない方式です。ここでは最終ログイン、ロック、MFA、初回変更、トークン版を確認し、必要に応じて全端末から強制ログアウトします。</p><div class="table-wrap"><table><thead><tr><th>利用者</th><th>権限・所属</th><th>認証状態</th><th>最終ログイン</th><th>操作</th></tr></thead><tbody id="authenticationUsers"></tbody></table></div></div></section>
<section class="panel"><div class="panel-heading"><h2>監査ログ検索</h2></div><div class="panel-body"><div class="filter-grid"><label>操作<input id="auditAction" placeholder="login / force-logout など"></label><label>対象<input id="auditEntity" placeholder="user / authentication など"></label><label>開始日<input id="auditFrom" type="date"></label><label>終了日<input id="auditTo" type="date"></label><button id="searchAudit" type="button">検索</button><button id="downloadAudit" type="button">JSON出力</button></div><div class="table-wrap"><table><thead><tr><th>日時</th><th>実施者</th><th>操作</th><th>対象</th><th>詳細</th></tr></thead><tbody id="auditResults"></tbody></table></div><p id="auditStatus" aria-live="polite"></p></div></section>
<section class="panel"><div class="panel-heading"><h2>バックアップ・復元確認</h2></div><div class="panel-body"><div class="check-grid"><label><input id="backupDatabase" type="checkbox"> データベースのバックアップを確認</label><label><input id="backupPhotos" type="checkbox"> 写真保存領域のバックアップを確認</label><label><input id="backupRestore" type="checkbox"> 復元テストを確認</label><label><input id="backupRetention" type="checkbox"> 保存世代・保管期間を確認</label></div><label>証跡・確認内容<textarea id="backupEvidence" rows="3"></textarea></label><button id="saveBackupVerification" type="button">確認記録を保存</button><p id="backupStatus" aria-live="polite"></p><div id="backupHistory" class="record-list"></div></div></section>
<section class="panel"><div class="panel-heading"><h2>運用開始判定</h2></div><div class="panel-body"><div id="readinessGate" class="readiness-gate"></div><div class="form-grid"><label>判定<select id="operationDecision"><option value="hold">保留</option><option value="pilot-ready">試験運用開始可</option><option value="production-ready">正式運用開始可</option></select></label><label>想定利用者数<input id="targetUsers" type="number" min="1" max="500" value="50"></label><label>判定理由<textarea id="decisionNote" rows="3"></textarea></label></div><button id="saveOperationDecision" type="button">判定を記録</button><p id="decisionStatus" aria-live="polite"></p><div id="decisionHistory" class="record-list"></div></div></section>
</main><script src="../assets/js/storage.js"></script><script src="../assets/js/api-client.js?v=508"></script><script src="../assets/js/role-access.js?v=503"></script><script src="../assets/js/production-identity-admin.js?v=206"></script><script src="../assets/js/session-guard.js?v=508"></script><script src="../assets/js/usage-tracking.js?v=222"></script>
