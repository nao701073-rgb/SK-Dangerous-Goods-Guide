<script src="../assets/js/structured-data-overrides.js?v=381"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用者管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css?v=178"><style>.user-admin{max-width:1180px;margin:auto;padding:24px}.notice{padding:12px 14px;border-radius:9px;background:#fff5d8;color:#765000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.grid label{display:grid;gap:6px}.grid input,.grid select{min-height:42px;padding:0 10px;border:1px solid #ccd9e6;border-radius:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.user-filter{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px auto;gap:10px;align-items:end;margin-bottom:14px}.user-filter label{display:grid;gap:5px}.user-filter input,.user-filter select{min-height:40px;padding:0 9px;border:1px solid #ccd9e6;border-radius:7px}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.pager .actions{align-items:center}@media(max-width:760px){.user-filter{grid-template-columns:1fr}.pager{align-items:flex-start;flex-direction:column}}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dbe5ef;text-align:left;white-space:nowrap}.dialog{border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}.dialog form{padding:22px;min-width:min(440px,90vw)}.dialog label{display:grid;gap:6px;margin:12px 0}.dialog input{min-height:44px;padding:0 10px}.dialog::backdrop{background:rgba(0,0,0,.45)}.user-admin-caption{margin:4px 0 0;color:#526b82;font-size:.78rem;line-height:1.5}.user-state{display:inline-flex;margin:2px 4px 2px 0;padding:3px 7px;border-radius:999px;background:#edf4fb;color:#244d72;font-size:.72rem;font-weight:700}.user-state.is-active{background:#e7f7ed;color:#176337}.user-state.is-inactive,.user-state.is-locked{background:#fff0ee;color:#9a3026}.last-login-never{color:#708397}.user-load-error{padding:22px;text-align:center;color:#9a3026;white-space:normal}</style>  <link rel="stylesheet" href="../assets/css/typography-quality.css?v=187">
</head><body data-page="user-admin" data-required-roles="office-admin,safety-environment-admin"><main class="user-admin"><p><a href="system-settings.html">← 設定へ戻る</a></p><h1>利用者管理</h1><p class="notice">各検査員には本人専用のログインIDとパスワードを発行し、共通アカウントは使用しません。事業所管理者は各事業所長が使用し、原則として1事業所につき有効な1アカウントとします。パスワード変更・アカウント有効化・ロック解除は、この管理者画面からのみ実行できます。操作は監査ログへ記録されます。</p><section class="panel"><div class="panel-heading"><h2>利用者登録</h2></div><div class="panel-body"><form id="userForm" class="grid"><label>ログインID<input id="loginId" required pattern="[A-Za-z0-9._-]{3,100}" autocomplete="off"><small>個人専用IDを設定してください。共通IDは使用不可です。</small></label><label>表示名<input id="displayName" required></label><label>初期パスワード<input id="initialPassword" type="password" required></label><label>権限<select id="role"><option value="office-user">検査員</option><option value="office-admin">事業所管理者（事業所長）</option><option value="safety-environment-director">安全環境室長（全事業所登録・編集／削除不可）</option><option value="safety-environment-staff">安全環境室（全事業所閲覧）</option><option value="safety-environment-admin">システム管理者</option><option value="guest">ゲスト（検索・法令・資料・ユーザー設定）</option><option value="validator">検証者</option><option value="revision-validator">改正検証者</option></select></label><label>所属事業所<select id="officeId"></select></label><label>メールアドレス（任意）<input id="email" type="email"></label><div><button type="submit">登録</button></div></form></div></section><section class="panel"><div class="panel-heading"><div><h2>登録済み利用者</h2><p class="user-admin-caption">最終ログインは、この環境で記録された最新日時を表示します。クラウドAPI接続時は全端末の記録、ローカル運用時はこのブラウザ内の記録です。</p></div><button id="reload" type="button">再読込</button></div><div class="panel-body"><form id="filterForm" class="user-filter"><label>氏名・ID・メール<input id="userSearch" type="search" placeholder="検索"></label><label>権限<select id="roleFilter"><option value="">すべて</option><option value="office-user">検査員</option><option value="office-admin">事業所管理者</option><option value="safety-environment-director">安全環境室長（全事業所登録・編集／削除不可）</option><option value="safety-environment-staff">安全環境室（全事業所閲覧）</option><option value="safety-environment-admin">システム管理者</option><option value="guest">ゲスト（検索・法令・資料・ユーザー設定）</option><option value="validator">検証者</option><option value="revision-validator">改正検証者</option></select></label><label>状態<select id="statusFilter"><option value="">すべて</option><option value="active">有効</option><option value="inactive">無効</option><option value="locked">ロック中</option></select></label><button type="submit">絞り込む</button></form><p id="status"></p><div class="table-wrap"><table><thead><tr><th>表示名</th><th>ID</th><th>権限</th><th>所属</th><th>状態</th><th>最終ログイン</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><div class="pager"><span id="pageInfo"></span><div class="actions"><button id="prevPage" type="button">前へ</button><button id="nextPage" type="button">次へ</button></div></div></div></section></main><dialog id="editDialog" class="dialog"><form id="editForm" method="dialog"><h2>利用者情報の変更</h2><input id="editUserId" type="hidden"><label>ログインID<input id="editLoginId" required pattern="[A-Za-z0-9._-]{3,100}" autocomplete="off"><small>苗字を想定したIDなど、半角英数字・._-で設定できます。</small></label><label>表示名<input id="editDisplayName" required></label><label>権限<select id="editRole"><option value="office-user">検査員</option><option value="office-admin">事業所管理者（事業所長）</option><option value="safety-environment-director">安全環境室長</option><option value="safety-environment-staff">安全環境室</option><option value="safety-environment-admin">システム管理者</option><option value="guest">ゲスト</option><option value="validator">検証者</option><option value="revision-validator">改正検証者</option></select></label><label>所属事業所<select id="editOfficeId"></select></label><div class="actions"><button value="cancel" formnovalidate>キャンセル</button><button id="saveUserEdit" value="default">変更する</button></div></form></dialog><dialog id="passwordDialog" class="dialog"><form id="passwordForm" method="dialog"><h2>利用者パスワード変更</h2><p id="passwordTarget"></p><input id="targetUserId" type="hidden"><label>新しいパスワード<input id="newPassword" type="password" required></label><label>管理者確認用パスワード<input id="administratorPassword" type="password" required autocomplete="current-password"></label><div class="actions"><button value="cancel" formnovalidate>キャンセル</button><button id="savePassword" value="default">変更する</button></div></form></dialog><script src="../assets/js/storage.js?v=178"></script><script src="../assets/js/organization.js?v=428"></script><script src="../assets/js/api-client.js?v=429"></script><script src="../assets/js/role-access.js?v=388"></script><script src="../assets/js/user-admin.js?v=429"></script>  <script src="../assets/js/session-guard.js?v=422"></script>
