<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用者管理</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-tools.css?v=171"><style>.user-admin{max-width:1180px;margin:auto;padding:24px}.notice{padding:12px 14px;border-radius:9px;background:#fff5d8;color:#765000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.grid label{display:grid;gap:6px}.grid input,.grid select{min-height:42px;padding:0 10px;border:1px solid #ccd9e6;border-radius:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dbe5ef;text-align:left;white-space:nowrap}.dialog{border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}.dialog form{padding:22px;min-width:min(440px,90vw)}.dialog label{display:grid;gap:6px;margin:12px 0}.dialog input{min-height:44px;padding:0 10px}.dialog::backdrop{background:rgba(0,0,0,.45)}</style></head><body><main class="user-admin"><p><a href="settings.html">← 設定へ戻る</a></p><h1>利用者管理</h1><p class="notice">各検査員には本人専用のログインIDとパスワードを発行し、共通アカウントは使用しません。事業所管理者は各事業所長が使用し、原則として1事業所につき有効な1アカウントとします。パスワード変更・アカウント有効化・ロック解除は、この管理者画面からのみ実行できます。操作は監査ログへ記録されます。</p><section class="panel"><div class="panel-heading"><h2>利用者登録</h2></div><div class="panel-body"><form id="userForm" class="grid"><label>ログインID<input id="loginId" required pattern="[A-Za-z0-9._-]{3,100}" autocomplete="off"><small>個人専用IDを設定してください。共通IDは使用不可です。</small></label><label>表示名<input id="displayName" required></label><label>初期パスワード<input id="initialPassword" type="password" required></label><label>権限<select id="role"><option value="office-user">検査員</option><option value="office-admin">事業所管理者（事業所長）</option><option value="safety-environment-admin">管理者</option><option value="guest">ゲスト</option><option value="validator">検証者</option></select></label><label>所属事業所<select id="officeId"></select></label><label>メールアドレス（任意）<input id="email" type="email"></label><div><button type="submit">登録</button></div></form></div></section><section class="panel"><div class="panel-heading"><h2>登録済み利用者</h2><button id="reload" type="button">再読込</button></div><div class="panel-body"><p id="status"></p><div class="table-wrap"><table><thead><tr><th>表示名</th><th>ID</th><th>権限</th><th>所属</th><th>状態</th><th>最終ログイン</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></div></section></main><dialog id="passwordDialog" class="dialog"><form id="passwordForm" method="dialog"><h2>利用者パスワード変更</h2><p id="passwordTarget"></p><input id="targetUserId" type="hidden"><label>新しいパスワード<input id="newPassword" type="password" required></label><label>管理者確認用パスワード<input id="administratorPassword" type="password" required autocomplete="current-password"></label><div class="actions"><button value="cancel" formnovalidate>キャンセル</button><button id="savePassword" value="default">変更する</button></div></form></dialog><script src="../assets/js/storage.js?v=171"></script><script src="../assets/js/api-client.js?v=171"></script><script src="../assets/js/user-admin.js?v=171"></script>  <script src="../assets/js/session-guard.js"></script>
</body></html>
