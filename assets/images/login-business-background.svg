      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6fd"/>
      <stop offset="1" stop-color="#dcecf8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
